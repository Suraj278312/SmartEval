{% extends "base.html" %}

{% block title %}Server Error (500) – SmartEval{% endblock %}

{% block content %}
<div class="container container-narrow" style="text-align: center; padding: 4rem 1rem;">
  <div style="width: 72px; height: 72px; border-radius: var(--radius-full); background: var(--amber-50); color: var(--amber-600); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.25rem;">
    ⚠️
  </div>
  <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--slate-900); letter-spacing: -0.02em;">Unexpected Error</h1>
  <p style="font-size: 1rem; color: var(--slate-600); max-width: 480px; margin: 0 auto 2rem; line-height: 1.6;">
    An unexpected condition occurred while processing your request. Any pending database transactions were rolled back safely.
  </p>
  <div>
    <a href="{{ url_for('index') }}" class="btn btn-primary" style="padding: 0.65rem 1.5rem; font-weight: 700; box-shadow: var(--shadow-sm);">
      Return to Safety
    </a>
  </div>
</div>
{% endblock %}
